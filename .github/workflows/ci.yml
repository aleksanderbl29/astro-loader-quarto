name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install dependencies in the declared shell
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm install --frozen-lockfile
      - name: Check types
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm run typecheck
      - name: Lint
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm run lint
      - name: Test real Quarto and Astro builds
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm test
      - name: Build example from committed GFM
        run: |
          nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm --dir examples/basic-blog install --frozen-lockfile
          nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm --dir examples/basic-blog run build
