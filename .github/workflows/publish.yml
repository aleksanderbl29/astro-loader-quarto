name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on main branch pushes, not on pull requests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install dependencies
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm install --frozen-lockfile

      - name: Run tests
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm test

      - name: Build package
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run github:cachix/devenv/2e5cfe21801beb8323d60689d9a82b5adc847988 -- shell -- pnpm run release
